name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # The build and tests only need syntactically valid values and mock every Supabase
      # call; real project values are supplied by Vercel at deploy time.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate environment files
        run: node scripts/generate-environments.mjs

      - name: Run unit tests with coverage gate
        run: npm run test:coverage -- --watch=false

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run e2e -- --trace off

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore

  supabase-sql:
    # Applies the Supabase migrations to a plain PostgreSQL with a minimal auth shim and runs the
    # RLS/RPC behaviour tests as the `authenticated` role.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run migration and policy tests
        run: ./scripts/test-supabase-sql.sh

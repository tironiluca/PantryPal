
<ng-container *transloco="let t">
  <mat-toolbar class="app-toolbar" color="primary">
    <div class="toolbar-content">
      <button class="brand" [matMenuTriggerFor]="navMenu" aria-label="Navigation menu">
        <mat-icon class="brand-icon">kitchen</mat-icon>
        <span class="brand-name">PantryPal</span>
      </button>
      <div class="toolbar-actions">
        @if (auth.isAuthenticated()) {
          @if (voiceSupported) {
            <button mat-icon-button (click)="toggleVoiceControl()" [matTooltip]="t('voice.voiceCommands')" class="voice-button" aria-label="Voice commands">
              <mat-icon>mic</mat-icon>
            </button>
          }
          <pp-sync-status></pp-sync-status>
        }
        <button mat-icon-button (click)="toggleTheme()" class="theme-toggle" aria-label="Toggle theme">
          <mat-icon>{{ theme.mode() === 'light' ? 'dark_mode' : 'light_mode' }}</mat-icon>
        </button>
        @if (auth.isAuthenticated()) {
          <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-button" aria-label="User menu">
            <mat-icon>account_circle</mat-icon>
          </button>
          <mat-menu #userMenu="matMenu">
            <button mat-menu-item routerLink="/auth/profile">
              <mat-icon>person</mat-icon>
              <span>Profile</span>
            </button>
            <button mat-menu-item routerLink="/home/settings">
              <mat-icon>settings</mat-icon>
              <span>Settings</span>
            </button>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        } @else {
          <button mat-icon-button routerLink="/auth/login" class="login-button" aria-label="Login">
            <mat-icon>login</mat-icon>
          </button>
        }
      </div>
    </div>
  </mat-toolbar>

  <!-- Navigation dropdown — visible on mobile, accessible on all screens -->
  <mat-menu #navMenu="matMenu" [overlapTrigger]="false" panelClass="nav-dropdown">
    @for (tab of tabs; track tab.route) {
      <a mat-menu-item
         [routerLink]="['/home', tab.route]"
         routerLinkActive
         #rla="routerLinkActive"
         [class.nav-active]="rla.isActive"
         [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>{{ tab.icon }}</mat-icon>
        <span>{{ t(tab.labelKey) }}</span>
      </a>
    }
  </mat-menu>

  <pp-voice-control-overlay></pp-voice-control-overlay>
  <router-outlet></router-outlet>
</ng-container>

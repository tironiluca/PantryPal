<section class="home-shell">
  <!-- Top Toolbar with Sync Status -->
  <mat-toolbar class="top-toolbar">
    <span class="app-title">
      <mat-icon class="app-icon">restaurant</mat-icon>
      PantryPal
    </span>
    <span class="spacer"></span>
    @if (voiceSupported) {
      <button
        mat-icon-button
        (click)="toggleVoiceControl()"
        matTooltip="Voice commands"
        class="voice-button"
      >
        <mat-icon>mic</mat-icon>
      </button>
    }
    <pp-sync-status></pp-sync-status>
  </mat-toolbar>

  <!-- Voice Control Overlay -->
  <pp-voice-control-overlay></pp-voice-control-overlay>

  <mat-tab-nav-panel #featurePanel>
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>

  <nav mat-tab-nav-bar mat-stretch-tabs [tabPanel]="featurePanel">

    @for (tab of tabs; track $index) {}
    <a
      mat-tab-link
      *ngFor="let tab of tabs"
      [routerLink]="['/home', tab.route]"
      routerLinkActive
      #rla="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [active]="rla.isActive">
      <mat-icon aria-hidden="true" style="margin: 3px;;">{{ tab.icon }}</mat-icon>
      <span class="labels" [matTooltip]="tab.description">
        <span class="primary">{{ tab.label }}</span>
      </span>
    </a>
  </nav>
</section>

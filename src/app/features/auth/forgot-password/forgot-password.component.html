
<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>
        <div class="auth-header">
          <mat-icon class="auth-icon">lock_reset</mat-icon>
          <h1>Reset Password</h1>
        </div>
      </mat-card-title>
      <mat-card-subtitle>
        Enter your email address and we'll send you a link to reset your password
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (!emailSent()) {
        <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input
              matInput
              type="email"
              name="email"
              [(ngModel)]="email"
              required
              email
              placeholder="your@email.com"
              autocomplete="email"
            />
            <mat-icon matPrefix>email</mat-icon>
          </mat-form-field>

          <button
            mat-raised-button
            color="primary"
            type="submit"
            class="full-width auth-button"
            [disabled]="!forgotForm.form.valid || loading()"
          >
            @if (loading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Send Reset Link
            }
          </button>
        </form>
      } @else {
        <div class="success-message">
          <mat-icon class="success-icon">check_circle</mat-icon>
          <p>
            Password reset email sent! Please check your inbox and follow the
            instructions to reset your password.
          </p>
        </div>
      }

      <div class="back-link">
        <a routerLink="/auth/login">
          <mat-icon>arrow_back</mat-icon>
          Back to Sign In
        </a>
      </div>
    </mat-card-content>
  </mat-card>
</div>

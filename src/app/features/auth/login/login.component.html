<div class="auth-container" *transloco="let t">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>
        <div class="auth-header">
          <mat-icon class="auth-icon">restaurant</mat-icon>
          <h1>{{ t('auth.welcomeTo') }}</h1>
        </div>
      </mat-card-title>
      <mat-card-subtitle>{{ t('auth.signInToSync') }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <!-- Email Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ t('auth.email') }}</mat-label>
          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            [placeholder]="t('auth.emailPlaceholder')"
            autocomplete="email"
          />
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ t('auth.password') }}</mat-label>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            name="password"
            [(ngModel)]="password"
            required
            minlength="6"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <mat-icon matPrefix>lock</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="t('auth.togglePasswordVisibility')"
          >
            <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </mat-form-field>

        <!-- Forgot Password Link -->
        <div class="forgot-password">
          <a routerLink="/auth/forgot-password">{{ t('auth.forgotPassword') }}</a>
        </div>

        <!-- Sign In Button -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width auth-button"
          [disabled]="!loginForm.form.valid || loading()"
        >
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            {{ t('auth.signIn') }}
          }
        </button>
      </form>

      <mat-divider class="divider">
        <span class="divider-text">{{ t('common.or') }}</span>
      </mat-divider>

      <!-- OAuth Buttons -->
      <div class="oauth-buttons">
        <button
          mat-stroked-button
          class="full-width oauth-button"
          (click)="signInWithGoogle()"
          [disabled]="loading()"
        >
          <mat-icon svgIcon="google"></mat-icon>
          {{ t('auth.continueWithGoogle') }}
        </button>

        <button
          mat-stroked-button
          class="full-width oauth-button"
          (click)="signInWithGitHub()"
          [disabled]="loading()"
        >
          <mat-icon>code</mat-icon>
          {{ t('auth.continueWithGithub') }}
        </button>
      </div>

      <!-- Sign Up Link -->
      <div class="signup-link">
        <p>
          {{ t('auth.noAccount') }}
          <a routerLink="/auth/register">{{ t('auth.signUp') }}</a>
        </p>
      </div>
    </mat-card-content>
  </mat-card>
</div>

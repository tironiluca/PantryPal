<h2 mat-dialog-title>
  {{ model?.id ? "Edit" : "Add" }} Inventory Item
</h2>

<div mat-dialog-content class="inventory-form">
  <mat-form-field appearance="outline">
    <mat-label>Ingredient ID</mat-label>
    <input matInput [(ngModel)]="model.ingredientId" />
  </mat-form-field>

  <div class="quantity-row">
    <mat-form-field appearance="outline">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" [(ngModel)]="model.quantity" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Unit</mat-label>
      <input matInput [(ngModel)]="model.unit" />
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline">
    <mat-label>Min Restock</mat-label>
    <input matInput type="number" [(ngModel)]="model.minRestock" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Barcode</mat-label>
    <input matInput [(ngModel)]="model.barcode" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Expiry (YYYY-MM-DD)</mat-label>
    <input matInput [(ngModel)]="model.expiry" />
  </mat-form-field>

  <div class="action-buttons">
    <button mat-stroked-button (click)="scanBarcode()">
      <mat-icon>qr_code_scanner</mat-icon>
      Scan Barcode
    </button>

    <button mat-stroked-button (click)="image_input.click()">
      <mat-icon>upload</mat-icon>
      Upload Image
    </button>

    <button
      mat-stroked-button
      (click)="fetchProduct()"
      [disabled]="!model.barcode"
    >
      <mat-icon>cloud_download</mat-icon>
      Fetch Product
    </button>

    <input
      [hidden]="true"
      #image_input
      type="file"
      (change)="onFile($event)"
      accept="image/*"
    />
  </div>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="close()">
    <mat-icon>close</mat-icon>
    Cancel
  </button>
  <button mat-flat-button color="primary" (click)="save()">
    <mat-icon>save</mat-icon>
    Save
  </button>
</div>
